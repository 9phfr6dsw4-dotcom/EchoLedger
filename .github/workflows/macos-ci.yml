name: EchoLedger CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on macOS 26
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner architecture and Xcode SDK
        run: |
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          printf 'macOS SDK: %s\n' "$sdk_version"
          sdk_major="${sdk_version%%.*}"
          test "$sdk_major" -ge 26
      - name: Run tests
        run: swift test
      - name: Build, package, and verify native app
        run: bash Scripts/package-app.sh
      - name: Launch packaged app from a clean location without .build
        run: bash Scripts/smoke-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EchoLedger-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/EchoLedger.zip
            dist/EchoLedger.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read version
        id: version
        run: |
          version="$(python3 -c "import plistlib; print(plistlib.load(open('Resources/Info.plist', 'rb'))['CFBundleShortVersionString'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'released=true' >> "$GITHUB_OUTPUT"
          else
            echo 'released=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.released == 'false'
        with:
          name: EchoLedger-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Verify checksum
        if: steps.existing.outputs.released == 'false'
        working-directory: release
        run: sha256sum -c EchoLedger.zip.sha256
      - name: Publish release
        if: steps.existing.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/releases/$VERSION.md"
          test -f "$notes" || { echo "Missing $notes"; exit 1; }
          gh release create "v$VERSION" release/EchoLedger.zip release/EchoLedger.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EchoLedger $VERSION" --notes-file "$notes"
